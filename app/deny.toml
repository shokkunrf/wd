# Adding or updating a crate changes its version in bans.allow, and a human approves it.

[graph]
targets = ["x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]

[advisories]
unmaintained = "all"
yanked = "deny"
ignore = []

[licenses]
# Keep in sync with accepted in about.toml.
allow = ["MIT", "Unicode-3.0"]
confidence-threshold = 0.93

[bans]
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = false
allow-workspace = true
allow = [
  { crate = "lexopt@=0.3.2", reason = "argument parsing" },
  { crate = "saphyr-parser@=0.3.3", reason = "YAML events, which are mapped to structs by hand" },
  { crate = "arraydeque@=0.5.1", reason = "dependency of saphyr-parser" },
  { crate = "thiserror@=2.0.21", reason = "dependency of saphyr-parser, not used for wd errors" },
  { crate = "thiserror-impl@=2.0.21", reason = "dependency of thiserror, a proc macro" },
  { crate = "proc-macro2@=1.0.107", reason = "dependency of thiserror-impl" },
  { crate = "quote@=1.0.47", reason = "dependency of thiserror-impl" },
  { crate = "syn@=3.0.10", reason = "dependency of thiserror-impl" },
  { crate = "unicode-ident@=1.0.27", reason = "dependency of proc-macro2" },
]
deny = [
  { crate = "ctor", reason = "runs code before main" },
  { crate = "linkme", reason = "gathers code at link time" },
  { crate = "inventory", reason = "runs code before main" },
]

[bans.build]
include-dependencies = true
executables = "deny"
interpreted = "deny"
allow-build-scripts = [
  { crate = "proc-macro2@=1.0.107", reason = "dependency of thiserror-impl, probes the compiler version" },
  { crate = "quote@=1.0.47", reason = "dependency of thiserror-impl, probes the compiler version" },
  { crate = "thiserror@=2.0.21", reason = "dependency of saphyr-parser, probes the compiler version" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
