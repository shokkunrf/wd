name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

defaults:
  run:
    working-directory: app

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: タグからバージョンを決める
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          # semverで、+のビルドメタデータは付けない
          id='(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
          if ! printf '%s\n' "$version" | grep -Eqx "(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-$id(\.$id)*)?"; then
            echo "::error::タグがv<semver>の形でない: $TAG"
            exit 1
          fi
          echo "WD_VERSION=$version" >> "$GITHUB_ENV"
      - name: musl-toolsを入れる
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools=1.2.4-2 musl-dev=1.2.4-2 musl=1.2.4-2
      - run: rustup toolchain install
      - run: cargo test --locked --target x86_64-unknown-linux-musl
      - name: cargo-aboutを入れる
        env:
          CARGO_ABOUT_VERSION: 0.9.3
          CARGO_ABOUT_SHA256: 3ad1e94ea1e63d69d1961f4fb15ccbbe9575d906111f96d2cb4dce6df48f71b4
        run: |
          name="cargo-about-${CARGO_ABOUT_VERSION}-x86_64-unknown-linux-musl"
          curl -fsSL -o "$RUNNER_TEMP/$name.tar.gz" "https://github.com/EmbarkStudios/cargo-about/releases/download/${CARGO_ABOUT_VERSION}/$name.tar.gz"
          echo "${CARGO_ABOUT_SHA256}  $RUNNER_TEMP/$name.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$name.tar.gz" -C "$RUNNER_TEMP"
          install -D -m 0755 "$RUNNER_TEMP/$name/cargo-about" "$RUNNER_TEMP/bin/cargo-about"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: 実行ファイルを作って検査し、著作権表示とまとめる
        run: ../.github/scripts/release-assets.sh "$RUNNER_TEMP/dist"
      - name: Releaseを作る
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -- "$RUNNER_TEMP/dist/wd-$WD_VERSION-x86_64-unknown-linux-musl.tar.gz" "$RUNNER_TEMP/dist/SHA256SUMS"
          case "$WD_VERSION" in
            *-*) set -- --prerelease "$@" ;;
          esac
          gh release create "$TAG" --verify-tag --title "$TAG" --notes "" "$@"
